name: Build Android APK 🚀

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential autoconf libtool pkg-config \
            libssl-dev libffi-dev zlib1g-dev libncurses-dev \
            cmake openjdk-17-jdk git wget curl unzip zip \
            python3-pip python3-dev python3-venv

      - name: 🎯 Setup Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer cython==0.29.33 virtualenv

      - name: 📱 Setup Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p $ANDROID_SDK_ROOT && cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" "build-tools;33.0.0" "platforms;android-33"

      - name: 🛠️ Setup Android NDK
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
        run: |
          mkdir -p $ANDROID_NDK_HOME && cd $ANDROID_NDK_HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c/* . && rm -rf android-ndk-r25c*

      - name: 🏗️ Build APK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
        run: |
          export ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk
          export ANDROID_NDK_HOME=${{ github.workspace }}/android-ndk
          echo "y" | buildozer android debug 2>&1 | tee build.log

      - name: 🔍 Find APK
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f
          echo "APK_FOUND=$(find . -name '*.apk' -type f -print -quit)" >> $GITHUB_ENV

      - name: 📱 Upload APK Artifact
        if: env.APK_FOUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: TravelAssistant-debug
          path: ${{ env.APK_FOUND }}
          retention-days: 90

      - name: ⚠️ No APK Found
        if: env.APK_FOUND == ''
        run: |
          echo "❌ No APK was generated. Check the build log."
          exit 1
